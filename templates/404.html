{% extends "base.html" %}

{% block title %}Page Not Found - Kisan+{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-green-400 to-blue-600 flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8 text-center">
        <div class="mb-6">
            <div class="text-6xl text-green-500 mb-4">404</div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Page Not Found</h1>
            <p class="text-gray-600">Sorry, the page you are looking for doesn't exist.</p>
        </div>
        
        <div class="space-y-4">
            <a href="{{ url_for('index') }}" 
               class="block w-full bg-green-500 text-white py-3 px-6 rounded-lg font-semibold hover:bg-green-600 transition duration-300">
                <i class="fas fa-home mr-2"></i>Go Home
            </a>
            
            <a href="{{ url_for('dashboard') }}" 
               class="block w-full bg-blue-500 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-600 transition duration-300">
                <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
            </a>
        </div>
        
        <div class="mt-6 text-sm text-gray-500">
            Need help? <a href="{{ url_for('forum') }}" class="text-green-500 hover:underline">Visit our forum</a>
        </div>
    </div>
</div>
{% endblock %}
